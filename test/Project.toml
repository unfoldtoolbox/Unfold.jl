# path dep (not registry) so that Pkg.test runs the tests against the
# local checkout rather than against a released registry version
[sources]
Unfold = {path = ".."}

# Pinned: the hardcoded expected values in test/predict.jl are measured with
# this version's `StableRNG(1)` stream. A newer release changes the stream
# (e.g. 1.0.4 -> 1.1.0) and shifts the simulated data and all r2/yhat values.
[compat]
StableRNGs = "= 1.1.0"
